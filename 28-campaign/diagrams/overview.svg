<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1300" height="640" viewBox="0 0 1300 640" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">28. Statement campaign: a resumable batch job</text>
<rect x="40" y="110" width="240" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="160.0" y="151.0" font-size="16" text-anchor="middle">enqueue: one job per</text><text x="160.0" y="171.0" font-size="16" text-anchor="middle">(year, member);</text><text x="160.0" y="191.0" font-size="16" text-anchor="middle">run twice: 16, then 0</text>
<rect x="340" y="110" width="280" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="480.0" y="141.0" font-size="16" text-anchor="middle">statement_jobs</text><text x="480.0" y="161.0" font-size="16" text-anchor="middle">pending, sending, retry,</text><text x="480.0" y="181.0" font-size="16" text-anchor="middle">sent, dead; lease,</text><text x="480.0" y="201.0" font-size="16" text-anchor="middle">attempts, pdf_sha256</text>
<rect x="680" y="110" width="280" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="820.0" y="141.0" font-size="16" text-anchor="middle">Workers (processes)</text><text x="820.0" y="161.0" font-size="16" text-anchor="middle">claim FOR UPDATE SKIP</text><text x="820.0" y="181.0" font-size="16" text-anchor="middle">LOCKED + a lease;</text><text x="820.0" y="201.0" font-size="16" text-anchor="middle">5 sends/s each</text>
<rect x="1020" y="110" width="240" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1140.0" y="141.0" font-size="16" text-anchor="middle">SMTP sink :52528</text><text x="1140.0" y="161.0" font-size="16" text-anchor="middle">bob 451 twice,</text><text x="1140.0" y="181.0" font-size="16" text-anchor="middle">carol 550,</text><text x="1140.0" y="201.0" font-size="16" text-anchor="middle">dan 451 always</text>
<polyline points="280,165 340,165" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="620,165 680,165" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="960,165 1020,165" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="680" y="280" width="280" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="820.0" y="311.0" font-size="16" text-anchor="middle">pdfkit: deterministic</text><text x="820.0" y="331.0" font-size="16" text-anchor="middle">PDF (fixed date) -&gt;</text><text x="820.0" y="351.0" font-size="16" text-anchor="middle">sha256 on the job</text>
<rect x="1020" y="280" width="240" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="1140.0" y="321.0" font-size="16" text-anchor="middle">4xx: retry, backoff</text><text x="1140.0" y="341.0" font-size="16" text-anchor="middle">with jitter, max 4</text>
<rect x="1020" y="430" width="240" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="1140.0" y="461.0" font-size="16" text-anchor="middle">5xx or 4 attempts:</text><text x="1140.0" y="481.0" font-size="16" text-anchor="middle">dead letter,</text><text x="1140.0" y="501.0" font-size="16" text-anchor="middle">reason kept</text>
<rect x="340" y="280" width="280" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="480.0" y="311.0" font-size="16" text-anchor="middle">crash after SMTP said OK:</text><text x="480.0" y="331.0" font-size="16" text-anchor="middle">lease expires, resent with</text><text x="480.0" y="351.0" font-size="16" text-anchor="middle">the same Message-ID</text>
<rect x="340" y="430" width="280" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="480.0" y="471.0" font-size="16" text-anchor="middle">Report: sent, retried,</text><text x="480.0" y="491.0" font-size="16" text-anchor="middle">in doubt, dead letters</text>
<polyline points="820,220 820,280" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="1140,220 1140,280" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<polyline points="1140,370 1140,430" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<polyline points="480,220 480,280" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<polyline points="480,370 480,430" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<text x="40.0" y="576.0" font-size="16" text-anchor="start">Before: a loop that renders, sends, next member. It crashed after member 7 and was run again: four members</text><text x="40.0" y="596.0" font-size="16" text-anchor="start">got two statements, greylisted bob got none. The job table makes progress, retries and the report queries.</text></svg>
