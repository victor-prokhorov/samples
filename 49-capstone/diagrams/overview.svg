<text x="40.0" y="776.0" font-size="16" text-anchor="start">Three journeys through one product: a member changes bank details (errors, then success) and switches to French;</text><text x="40.0" y="796.0" font-size="16" text-anchor="start">an employer admin sees her organisation's members; staff approve the change, never their own, and read the KPIs.</text><text x="40.0" y="816.0" font-size="16" text-anchor="start">The number in each box is the sample that teaches that piece in depth.</text></svg>
