<text x="40.0" y="626.0" font-size="16" text-anchor="start">Legacy is the reference, bugs included, until someone decides otherwise. Four quirks kept, the leap-year age fixed</text><text x="40.0" y="646.0" font-size="16" text-anchor="start">on purpose (the allowlist). A later rounding change shows up as 430 unexplained mismatches: the bar turns red.</text></svg>
