<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1280" height="650" viewBox="0 0 1280 650" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">25. Bilingual pages: catalogues, Intl and negotiation</text>
<rect x="40" y="150" width="240" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="160.0" y="181.0" font-size="16" text-anchor="middle">Request</text><text x="160.0" y="201.0" font-size="16" text-anchor="middle">Accept-Language:</text><text x="160.0" y="221.0" font-size="16" text-anchor="middle">fr-CA, fr;q=0.9, en;q=0.8</text><text x="160.0" y="241.0" font-size="16" text-anchor="middle">or ?lang=fr (wins)</text>
<rect x="340" y="150" width="240" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="460.0" y="181.0" font-size="16" text-anchor="middle">negotiate.ts</text><text x="460.0" y="201.0" font-size="16" text-anchor="middle">q-values, q=0 never,</text><text x="460.0" y="221.0" font-size="16" text-anchor="middle">exact, then primary</text><text x="460.0" y="241.0" font-size="16" text-anchor="middle">language, fallback en</text>
<rect x="640" y="90" width="300" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="790.0" y="121.0" font-size="16" text-anchor="middle">messages/fr.json</text><text x="790.0" y="141.0" font-size="16" text-anchor="middle">ICU MessageFormat: plural,</text><text x="790.0" y="161.0" font-size="16" text-anchor="middle">select, number, date;</text><text x="790.0" y="181.0" font-size="16" text-anchor="middle">whole sentences</text>
<rect x="640" y="230" width="300" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="790.0" y="261.0" font-size="16" text-anchor="middle">Intl in fr-FR</text><text x="790.0" y="281.0" font-size="16" text-anchor="middle">1 234,56 € with</text><text x="790.0" y="301.0" font-size="16" text-anchor="middle">no-break spaces</text>
<rect x="1000" y="150" width="240" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="1120.0" y="181.0" font-size="16" text-anchor="middle">Page</text><text x="1120.0" y="201.0" font-size="16" text-anchor="middle">&lt;html lang="fr"&gt;</text><text x="1120.0" y="221.0" font-size="16" text-anchor="middle">Content-Language,</text><text x="1120.0" y="241.0" font-size="16" text-anchor="middle">Vary: Accept-Language</text>
