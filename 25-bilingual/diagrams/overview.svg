<text x="550.0" y="416.0" font-size="16" text-anchor="middle">CI: catalogue check, same keys, same</text><text x="550.0" y="436.0" font-size="16" text-anchor="middle">ICU arguments and types, same select cases</text>
<rect x="820" y="380" width="420" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1030.0" y="416.0" font-size="16" text-anchor="middle">en-XA pseudo-locale: accented, +40%, in ⟦ ⟧:</text><text x="1030.0" y="436.0" font-size="16" text-anchor="middle">any text without brackets skipped the catalogue</text>
<rect x="40" y="500" width="1200" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="640.0" y="526.0" font-size="16" text-anchor="middle">Before (/naive): "€" + toFixed(2) gives €4111.06, toDateString() gives Sat Jan 31 2026,</text><text x="640.0" y="546.0" font-size="16" text-anchor="middle">"request(s)" gives 0 pending request(s), and no lang for the screen reader</text>
<text x="40.0" y="606.0" font-size="16" text-anchor="start">CLDR plurals differ: English puts 0 in "other" (0 pending requests), French in "one" (0 demande en attente).</text></svg>
