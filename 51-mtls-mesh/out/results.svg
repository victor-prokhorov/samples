<line x1="20" x2="1100" y1="374" y2="374" stroke="#ccc"/>
<text x="20" y="414" font-size="12" fill="#444">Grey: the call went through, or the wire was encrypted. Dashed: refused, or readable. Only orders should get through, and only as orders; everyone else should be refused.</text>
