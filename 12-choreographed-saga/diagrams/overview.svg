<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1240" height="560" viewBox="0 0 1240 560" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">12. Choreographed saga: services react to each other's events</text>
<rect x="40" y="90" width="1160" height="230" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="50.0" y="116.0" font-size="18" text-anchor="start" font-weight="bold">Each reaction is one local tx: processed_messages + effect + outbox; a relay per service -&gt; Kafka</text>
<rect x="60" y="150" width="200" height="140" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="160.0" y="196.0" font-size="16" text-anchor="middle">orders</text><text x="160.0" y="216.0" font-size="16" text-anchor="middle">state machine,</text><text x="160.0" y="236.0" font-size="16" text-anchor="middle">listens to the</text><text x="160.0" y="256.0" font-size="16" text-anchor="middle">other three</text>
<rect x="380" y="150" width="200" height="140" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="480.0" y="216.0" font-size="16" text-anchor="middle">inventory</text><text x="480.0" y="236.0" font-size="16" text-anchor="middle">reserve, release</text>
<rect x="700" y="150" width="200" height="140" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="800.0" y="216.0" font-size="16" text-anchor="middle">payments</text><text x="800.0" y="236.0" font-size="16" text-anchor="middle">charge, refund</text>
<rect x="980" y="150" width="200" height="140" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1080.0" y="216.0" font-size="16" text-anchor="middle">shipping</text><text x="1080.0" y="236.0" font-size="16" text-anchor="middle">ship</text>
<polyline points="260,190 320,190 380,190" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="277.5" y="179.3" width="85.0" height="21.5" fill="#ffffff"/>
<text x="320.0" y="195.3" font-size="14" text-anchor="middle">OrderPlaced</text>
<polyline points="580,190 640,190 700,190" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="604.5" y="170.5" width="71.0" height="39.0" fill="#ffffff"/>
<text x="640.0" y="186.5" font-size="14" text-anchor="middle">Inventory</text><text x="640.0" y="204.0" font-size="14" text-anchor="middle">Reserved</text>
<polyline points="900,190 940,190 980,190" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="911.5" y="170.5" width="57.0" height="39.0" fill="#ffffff"/>
<text x="940.0" y="186.5" font-size="14" text-anchor="middle">Payment</text><text x="940.0" y="204.0" font-size="14" text-anchor="middle">Charged</text>
<polyline points="980,260 940,260 900,260" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<rect x="908.0" y="240.5" width="64.0" height="39.0" fill="#ffffff"/>
<text x="940.0" y="256.5" font-size="14" text-anchor="middle">Shipment</text><text x="940.0" y="274.0" font-size="14" text-anchor="middle">Failed</text>
<polyline points="700,260 640,260 580,260" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<rect x="604.5" y="231.8" width="71.0" height="56.5" fill="#ffffff"/>
<text x="640.0" y="247.8" font-size="14" text-anchor="middle">Payment</text><text x="640.0" y="265.3" font-size="14" text-anchor="middle">Failed or</text><text x="640.0" y="282.8" font-size="14" text-anchor="middle">Refunded</text>
<rect x="40" y="370" width="540" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="310.0" y="406.0" font-size="16" text-anchor="middle">inventory crashes after its commit, before the offset commit:</text><text x="310.0" y="426.0" font-size="16" text-anchor="middle">Kafka redelivers OrderPlaced, processed_messages skips it</text>
<rect x="660" y="370" width="540" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="930.0" y="406.0" font-size="16" text-anchor="middle">No one place knows the saga: timeline.ts rebuilds</text><text x="930.0" y="426.0" font-size="16" text-anchor="middle">order-C from four outboxes by correlation id</text>
<text x="40.0" y="496.0" font-size="16" text-anchor="start">No orchestrator, same end state as 08 (stock 6). The price: three pairs of services depend on each other's</text><text x="40.0" y="516.0" font-size="16" text-anchor="start">events, ordering holds only per partition, and changing the flow means redeploying several services.</text></svg>
