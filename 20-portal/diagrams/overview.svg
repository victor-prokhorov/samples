<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1260" height="680" viewBox="0 0 1260 680" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">20. Member portal: server-rendered, works without JavaScript</text>
<rect x="40" y="190" width="200" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="140.0" y="226.0" font-size="16" text-anchor="middle">Browser</text><text x="140.0" y="246.0" font-size="16" text-anchor="middle">no JavaScript needed:</text><text x="140.0" y="266.0" font-size="16" text-anchor="middle">GET pages,</text><text x="140.0" y="286.0" font-size="16" text-anchor="middle">POST forms</text>
<rect x="300" y="90" width="580" height="390" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="310.0" y="116.0" font-size="18" text-anchor="start" font-weight="bold">next start :53030 (Next.js App Router)</text>
<rect x="320" y="140" width="540" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="590.0" y="176.0" font-size="16" text-anchor="middle">Server components (profile, contributions):</text><text x="590.0" y="196.0" font-size="16" text-anchor="middle">async, query Postgres, return HTML</text>
<rect x="320" y="240" width="540" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="590.0" y="276.0" font-size="16" text-anchor="middle">Server action (the address form posts to it):</text><text x="590.0" y="296.0" font-size="16" text-anchor="middle">zod validates; invalid -&gt; 200 with the errors;</text><text x="590.0" y="316.0" font-size="16" text-anchor="middle">valid -&gt; INSERT, then 303 to /requests/:id</text>
<rect x="320" y="360" width="540" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="590.0" y="396.0" font-size="16" text-anchor="middle">requireMember(): member id from the signed</text><text x="590.0" y="416.0" font-size="16" text-anchor="middle">HttpOnly cookie, never from the URL or the form;</text><text x="590.0" y="436.0" font-size="16" text-anchor="middle">Origin check refuses cross-site actions</text>
<rect x="960" y="200" width="260" height="140" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1090.0" y="236.0" font-size="16" text-anchor="middle">Postgres :55451</text><text x="1090.0" y="256.0" font-size="16" text-anchor="middle">every query filters</text><text x="1090.0" y="276.0" font-size="16" text-anchor="middle">on the session's member</text><text x="1090.0" y="296.0" font-size="16" text-anchor="middle">partial unique index:</text><text x="1090.0" y="316.0" font-size="16" text-anchor="middle">one pending change</text>
<polyline points="240,250 300,250" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="860,210 960,210" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="860,290 960,290" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="40" y="520" width="1180" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="630.0" y="546.0" font-size="16" text-anchor="middle">Before: a fetch-only form with browser-only validation and the member id taken from the URL:</text><text x="630.0" y="566.0" font-size="16" text-anchor="middle">dead without JavaScript, skipped by a direct POST, and one member can read another's data</text>
<text x="40.0" y="616.0" font-size="16" text-anchor="start">In the run, bob asking for alice's request gets 404, a forged member_id field is ignored, a cross-origin action</text><text x="40.0" y="636.0" font-size="16" text-anchor="start">is aborted, and four address submissions (invalid, valid, duplicate, cross-origin) leave exactly one row.</text></svg>
