<text x="155.0" y="476.0" font-size="16" text-anchor="middle">base backup</text><text x="155.0" y="496.0" font-size="16" text-anchor="middle">(pg_basebackup)</text><text x="155.0" y="516.0" font-size="16" text-anchor="middle">+ WAL archive</text>
<rect x="290" y="440" width="230" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="405.0" y="476.0" font-size="16" text-anchor="middle">writes go on, then a</text><text x="405.0" y="496.0" font-size="16" text-anchor="middle">DELETE without WHERE;</text><text x="405.0" y="516.0" font-size="16" text-anchor="middle">pg_waldump finds its xid</text>
<rect x="560" y="440" width="230" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="675.0" y="476.0" font-size="16" text-anchor="middle">fresh container:</text><text x="675.0" y="496.0" font-size="16" text-anchor="middle">replay WAL to</text><text x="675.0" y="516.0" font-size="16" text-anchor="middle">just before that xid</text>
<rect x="830" y="440" width="250" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="955.0" y="476.0" font-size="16" text-anchor="middle">row counts and md5 match,</text><text x="955.0" y="496.0" font-size="16" text-anchor="middle">rows put back;</text><text x="955.0" y="516.0" font-size="16" text-anchor="middle">RPO and RTO vs targets</text>
<polyline points="250,490 290,490" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="520,490 560,490" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="790,490 830,490" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<text x="40.0" y="616.0" font-size="16" text-anchor="start">Each runbook is Markdown the runner executes; every run and step is recorded in ops.runs and ops.steps. Dashed: failure paths.</text><text x="40.0" y="636.0" font-size="16" text-anchor="start">The drill measures what a restore loses (RPO) and how long it takes (RTO) instead of assuming them.</text></svg>
