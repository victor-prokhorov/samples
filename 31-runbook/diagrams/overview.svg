<rect x="40" y="380" width="1060" height="190" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="50.0" y="406.0" font-size="18" text-anchor="start" font-weight="bold">The drill (runbooks/backup-restore-drill.md, itself a runbook)</text>
