<text x="74" y="329" font-size="11" fill="#52514e" text-anchor="end">50</text>
<line x1="80" x2="440" y1="260" y2="260" stroke="#dddcd7"/>
<text x="74" y="264" font-size="11" fill="#52514e" text-anchor="end">100</text>
<line x1="80" x2="440" y1="195" y2="195" stroke="#dddcd7"/>
<text x="74" y="199" font-size="11" fill="#52514e" text-anchor="end">150</text>
