<text x="440" y="406" font-size="11" fill="#52514e" text-anchor="middle">200</text>
<text x="260" y="426" font-size="12" fill="#52514e" text-anchor="middle">offered (req/s)</text>
<text x="30" y="120" font-size="12" fill="#52514e" text-anchor="start">served (req/s)</text>
<line x1="80" y1="390" x2="440" y2="130" stroke="#52514e" stroke-dasharray="4 4"/>
<text x="436" y="146" font-size="11" fill="#52514e" text-anchor="end">served = offered</text>
<line x1="80" x2="440" y1="260" y2="260" stroke="#0b0b0b" stroke-dasharray="2 4"/>
<text x="86" y="254" font-size="11" fill="#0b0b0b" text-anchor="start">capacity by Little's law: 100/s</text>
