<svg xmlns="http://www.w3.org/2000/svg" width="980" height="510" viewBox="0 0 980 510" font-family="Helvetica, Arial, sans-serif">
<rect width="980" height="510" fill="#fcfcfb"/>
<text x="24" y="32" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">Ramp: GET /members/:id/statement, one step every 4 s</text>
<text x="24" y="54" font-size="12" fill="#52514e" text-anchor="start">Little's law: 4 connections / 40 ms per statement = 100 req/s at most. Past that, requests queue and latency climbs while throughput stays flat.</text>
<text x="30" y="96" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Throughput served vs offered</text>
<line x1="80" x2="440" y1="390" y2="390" stroke="#dddcd7"/>
<text x="74" y="394" font-size="11" fill="#52514e" text-anchor="end">0</text>
