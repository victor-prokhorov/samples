<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1260" height="740" viewBox="0 0 1260 740" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">26. Single sign-on with OpenID Connect (code flow + PKCE)</text>
<rect x="40" y="150" width="220" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="150.0" y="196.0" font-size="16" text-anchor="middle">Browser</text><text x="150.0" y="216.0" font-size="16" text-anchor="middle">one cookie jar</text><text x="150.0" y="236.0" font-size="16" text-anchor="middle">per host</text>
<rect x="460" y="100" width="360" height="190" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="640.0" y="151.0" font-size="16" text-anchor="middle">Portal app :53037 (relying party)</text><text x="640.0" y="171.0" font-size="16" text-anchor="middle">1 /login: state, nonce, PKCE</text><text x="640.0" y="191.0" font-size="16" text-anchor="middle">verifier in login_transactions</text><text x="640.0" y="211.0" font-size="16" text-anchor="middle">3 /callback: used once, code +</text><text x="640.0" y="231.0" font-size="16" text-anchor="middle">verifier -&gt; tokens; ID token:</text><text x="640.0" y="251.0" font-size="16" text-anchor="middle">signature, iss, aud, nonce</text>
<rect x="980" y="100" width="240" height="190" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1100.0" y="151.0" font-size="16" text-anchor="middle">IdP :53036</text><text x="1100.0" y="171.0" font-size="16" text-anchor="middle">(OpenID Provider)</text><text x="1100.0" y="191.0" font-size="16" text-anchor="middle">oidc-provider,</text><text x="1100.0" y="211.0" font-size="16" text-anchor="middle">PKCE required;</text><text x="1100.0" y="231.0" font-size="16" text-anchor="middle">its own session</text><text x="1100.0" y="251.0" font-size="16" text-anchor="middle">= single sign-on</text>
<rect x="460" y="360" width="360" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="640.0" y="396.0" font-size="16" text-anchor="middle">Postgres</text><text x="640.0" y="416.0" font-size="16" text-anchor="middle">users by (issuer, sub), sessions</text><text x="640.0" y="436.0" font-size="16" text-anchor="middle">(only the cookie's sha256),</text><text x="640.0" y="456.0" font-size="16" text-anchor="middle">role_mappings: groups -&gt; roles</text>
<polyline points="260,210 360,210 460,210" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="317.5" y="199.3" width="85.0" height="21.5" fill="#ffffff"/>
<text x="360.0" y="215.3" font-size="14" text-anchor="middle">1, 3, 4 /me</text>
<polyline points="820,195 900,195 980,195" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="871.5" y="175.5" width="57.0" height="39.0" fill="#ffffff"/>
<text x="900.0" y="191.5" font-size="14" text-anchor="middle">code -&gt;</text><text x="900.0" y="209.0" font-size="14" text-anchor="middle">tokens</text>
<polyline points="640,290 640,360" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="150,270 150,530 1100,530 1100,290" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="400.5" y="519.3" width="449.0" height="21.5" fill="#ffffff"/>
<text x="625.0" y="535.3" font-size="14" text-anchor="middle">2 sign in at the IdP (password once), 302 back with ?code&amp;state</text>
<rect x="40" y="580" width="1180" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="630.0" y="606.0" font-size="16" text-anchor="middle">Refused: a state this app did not issue, a callback replayed, a token minted for another client or login,</text><text x="630.0" y="626.0" font-size="16" text-anchor="middle">returnTo pointing off the app (open redirect); a signed-in user with no mapped role gets 403</text>
<text x="40.0" y="676.0" font-size="16" text-anchor="start">The app never sees a password. Roles come from the IdP's groups through role_mappings, checked on every request.</text><text x="40.0" y="696.0" font-size="16" text-anchor="start">Logout deletes the app session and ends the IdP session, so the next login asks for the password again.</text></svg>
