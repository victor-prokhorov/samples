<text x="40.0" y="496.0" font-size="16" text-anchor="start">The same stages and gates in .gitlab-ci.yml, github-actions/ci.yml and azure-pipelines.yml (scripts/compare.ts checks it).</text><text x="40.0" y="516.0" font-size="16" text-anchor="start">Dashed: the failure path. A failed gate stops every later stage; production only changes on a schedule or a release tag.</text></svg>
