<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1060" height="580" viewBox="0 0 1060 580" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">45. Rate limiting: one tenant must not starve the others</text>
<rect x="40" y="110" width="240" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="160.0" y="141.0" font-size="16" text-anchor="middle">acme-batch</text><text x="160.0" y="161.0" font-size="16" text-anchor="middle">ignores 429, hammers</text>
