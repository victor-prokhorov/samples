<text x="40.0" y="516.0" font-size="16" text-anchor="start">Token bucket per tenant (50/s) and per API key (30/s), taken from both or from neither, in one locked statement.</text><text x="40.0" y="536.0" font-size="16" text-anchor="start">The noisy tenant queues in front of the limiter, not in the pool everyone shares.</text></svg>
