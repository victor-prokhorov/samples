<text x="160.0" y="241.0" font-size="16" text-anchor="middle">acme-sync</text><text x="160.0" y="261.0" font-size="16" text-anchor="middle">Retry-After + jitter</text>
<rect x="40" y="310" width="240" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="160.0" y="341.0" font-size="16" text-anchor="middle">Globex, Initech portals</text><text x="160.0" y="361.0" font-size="16" text-anchor="middle">20 req/s each</text>
<rect x="380" y="190" width="260" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="510.0" y="231.0" font-size="16" text-anchor="middle">Limiter</text><text x="510.0" y="251.0" font-size="16" text-anchor="middle">local memory of the last "no"</text><text x="510.0" y="271.0" font-size="16" text-anchor="middle">then take_tokens()</text>
<rect x="380" y="380" width="260" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="510.0" y="406.0" font-size="16" text-anchor="middle">Postgres: buckets</text><text x="510.0" y="426.0" font-size="16" text-anchor="middle">one row per tenant and key,</text><text x="510.0" y="446.0" font-size="16" text-anchor="middle">locked FOR UPDATE</text>
<rect x="780" y="190" width="240" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="900.0" y="231.0" font-size="16" text-anchor="middle">Member API</text><text x="900.0" y="251.0" font-size="16" text-anchor="middle">shared pool of 4</text><text x="900.0" y="271.0" font-size="16" text-anchor="middle">(about 200 req/s)</text>
<rect x="780" y="380" width="240" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="900.0" y="416.0" font-size="16" text-anchor="middle">429 + Retry-After</text><text x="900.0" y="436.0" font-size="16" text-anchor="middle">RateLimit, RateLimit-Policy</text>
