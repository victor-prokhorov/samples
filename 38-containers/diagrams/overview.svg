<text x="40.0" y="576.0" font-size="16" text-anchor="start">Naive (one stage, flip at once, SIGKILL): 44 MB of build leftovers, a token in the history, hundreds of failed requests.</text><text x="40.0" y="596.0" font-size="16" text-anchor="start">Multi-stage + readiness + graceful SIGTERM: 1 MB on top of the base, nothing secret in the layers, zero failed requests.</text></svg>
