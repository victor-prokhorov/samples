services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "55468:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
# The blue and green app containers are started by src/demo.ts with docker run on this project's
# network (38-containers_default), where the database answers as postgres:5432.
