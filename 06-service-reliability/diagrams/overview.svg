<text x="50.0" y="116.0" font-size="18" text-anchor="start" font-weight="bold">Caller, src/resilience.ts (no library)</text>
<rect x="60" y="140" width="440" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="280.0" y="171.0" font-size="16" text-anchor="middle">Bulkhead: at most 4 payments calls</text><text x="280.0" y="191.0" font-size="16" text-anchor="middle">in flight, reject the rest at once</text>
<rect x="60" y="235" width="440" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="280.0" y="266.0" font-size="16" text-anchor="middle">Circuit breaker: open after 5 failures,</text><text x="280.0" y="286.0" font-size="16" text-anchor="middle">one half-open probe after 1s</text>
<rect x="60" y="330" width="440" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="280.0" y="361.0" font-size="16" text-anchor="middle">Retries: transient errors only,</text><text x="280.0" y="381.0" font-size="16" text-anchor="middle">full jitter, retry budget</text>
<rect x="60" y="425" width="440" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="280.0" y="456.0" font-size="16" text-anchor="middle">Timeout on every attempt,</text><text x="280.0" y="476.0" font-size="16" text-anchor="middle">remaining budget in x-deadline-ms</text>
<rect x="60" y="520" width="440" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="280.0" y="551.0" font-size="16" text-anchor="middle">POST /charges with one Idempotency-Key</text><text x="280.0" y="571.0" font-size="16" text-anchor="middle">per operation, reused on every retry</text>
<polyline points="280,210 280,235" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="280,305 280,330" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="280,400 280,425" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="280,495 280,520" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="640" y="470" width="300" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="790.0" y="506.0" font-size="16" text-anchor="middle">payments :53010</text><text x="790.0" y="526.0" font-size="16" text-anchor="middle">SET LOCAL statement_timeout</text><text x="790.0" y="546.0" font-size="16" text-anchor="middle">= the caller's deadline</text><text x="790.0" y="566.0" font-size="16" text-anchor="middle">(faults switched by the demo)</text>
<rect x="640" y="290" width="300" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="790.0" y="316.0" font-size="16" text-anchor="middle">Postgres</text><text x="790.0" y="336.0" font-size="16" text-anchor="middle">charges + idempotency_keys</text><text x="790.0" y="356.0" font-size="16" text-anchor="middle">(key is the primary key,</text><text x="790.0" y="376.0" font-size="16" text-anchor="middle">response stored in the same tx)</text>
<rect x="640" y="140" width="300" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="790.0" y="171.0" font-size="16" text-anchor="middle">catalog :53011</text><text x="790.0" y="191.0" font-size="16" text-anchor="middle">healthy, its own socket pool</text>
<polyline points="500,555 640,555" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="790,470 790,390" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="500,175 640,175" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="538.0" y="164.3" width="64.0" height="21.5" fill="#ffffff"/>
<text x="570.0" y="180.3" font-size="14" text-anchor="middle">own pool</text>
<text x="40.0" y="646.0" font-size="16" text-anchor="start">Deadline propagation: 15050 -&gt; 2045 ms of DB time. Lockstep retries: 25 of 100 callers succeed, full jitter: 100.</text><text x="40.0" y="666.0" font-size="16" text-anchor="start">Outage with a retry budget: 110 requests instead of 500. No key: alice pays twice; with a key bob pays once.</text><text x="40.0" y="686.0" font-size="16" text-anchor="start">Breaker: 9 of 40 calls reach a degraded payments instead of 40. Bulkhead: catalog answers in 2 ms, not 1457 ms.</text></svg>
