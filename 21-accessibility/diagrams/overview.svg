<polyline points="720,430 820,430" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<text x="40.0" y="546.0" font-size="16" text-anchor="start">axe: 3 violations on /bad, 0 on /good in both states. axe alone misses the placeholder-only labels, the</text><text x="40.0" y="566.0" font-size="16" text-anchor="start">colour-only error and the unreachable button: the accessibility tree and the keyboard journey find them.</text></svg>
