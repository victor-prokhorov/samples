<text x="200.0" y="186.0" font-size="16" text-anchor="middle">no lang, low contrast,</text><text x="200.0" y="206.0" font-size="16" text-anchor="middle">unlabelled radios</text>
<rect x="440" y="140" width="280" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="580.0" y="186.0" font-size="16" text-anchor="middle">axe-core scan</text><text x="580.0" y="206.0" font-size="16" text-anchor="middle">of every page state</text>
<rect x="820" y="140" width="320" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="980.0" y="186.0" font-size="16" text-anchor="middle">lang, labels, fieldset</text><text x="980.0" y="206.0" font-size="16" text-anchor="middle">and legend, contrast</text>
