<text x="200.0" y="296.0" font-size="16" text-anchor="middle">error shown only as a red</text><text x="200.0" y="316.0" font-size="16" text-anchor="middle">border: a screen reader</text><text x="200.0" y="336.0" font-size="16" text-anchor="middle">hears nothing</text>
<rect x="440" y="260" width="280" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="580.0" y="296.0" font-size="16" text-anchor="middle">accessibility tree</text><text x="580.0" y="316.0" font-size="16" text-anchor="middle">through Chrome DevTools:</text><text x="580.0" y="336.0" font-size="16" text-anchor="middle">name, description, invalid</text>
<rect x="820" y="260" width="320" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="980.0" y="296.0" font-size="16" text-anchor="middle">error in text, aria-describedby,</text><text x="980.0" y="316.0" font-size="16" text-anchor="middle">aria-invalid, an error</text><text x="980.0" y="336.0" font-size="16" text-anchor="middle">summary that takes focus</text>
