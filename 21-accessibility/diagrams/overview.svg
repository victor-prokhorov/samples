<rect x="820" y="380" width="320" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="980.0" y="426.0" font-size="16" text-anchor="middle">a real &lt;button&gt;; the form</text><text x="980.0" y="446.0" font-size="16" text-anchor="middle">completes by keyboard</text>
