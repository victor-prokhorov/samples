<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="650" viewBox="0 0 1000 650" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">14. Sharding: each shard its own server, with read replicas</text>
<rect x="40" y="220" width="200" height="170" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="140.0" y="251.0" font-size="16" text-anchor="middle">App router</text><text x="140.0" y="271.0" font-size="16" text-anchor="middle">md5(customer_id)</text><text x="140.0" y="291.0" font-size="16" text-anchor="middle">% 2</text><text x="140.0" y="311.0" font-size="16" text-anchor="middle"></text><text x="140.0" y="331.0" font-size="16" text-anchor="middle">writes: primary</text><text x="140.0" y="351.0" font-size="16" text-anchor="middle">reads: replicas,</text><text x="140.0" y="371.0" font-size="16" text-anchor="middle">round-robin</text>
<rect x="340" y="90" width="620" height="200" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="350.0" y="116.0" font-size="18" text-anchor="start" font-weight="bold">Shard 0 (alice)</text>
<rect x="360" y="140" width="240" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="480.0" y="196.0" font-size="16" text-anchor="middle">shard0-primary :55441</text><text x="480.0" y="216.0" font-size="16" text-anchor="middle">the only writer</text>
<rect x="700" y="140" width="240" height="50" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="820.0" y="171.0" font-size="16" text-anchor="middle">shard0-replica-1</text>
<rect x="700" y="210" width="240" height="50" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="820.0" y="241.0" font-size="16" text-anchor="middle">shard0-replica-2</text>
<polyline points="600,165 700,165" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="635.5" y="154.3" width="29.0" height="21.5" fill="#ffffff"/>
<text x="650.0" y="170.3" font-size="14" text-anchor="middle">WAL</text>
<polyline points="600,235 700,235" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="635.5" y="224.3" width="29.0" height="21.5" fill="#ffffff"/>
<text x="650.0" y="240.3" font-size="14" text-anchor="middle">WAL</text>
<rect x="340" y="320" width="620" height="200" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="350.0" y="346.0" font-size="18" text-anchor="start" font-weight="bold">Shard 1 (dave)</text>
<rect x="360" y="370" width="240" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="480.0" y="416.0" font-size="16" text-anchor="middle">shard1-primary :55442</text><text x="480.0" y="436.0" font-size="16" text-anchor="middle">stopped: its writes</text><text x="480.0" y="456.0" font-size="16" text-anchor="middle">fail (no failover)</text>
<rect x="700" y="370" width="240" height="50" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="820.0" y="401.0" font-size="16" text-anchor="middle">shard1-replica-1</text>
<rect x="700" y="440" width="240" height="50" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="820.0" y="471.0" font-size="16" text-anchor="middle">shard1-replica-2</text>
<polyline points="600,395 700,395" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<rect x="635.5" y="384.3" width="29.0" height="21.5" fill="#ffffff"/>
<text x="650.0" y="400.3" font-size="14" text-anchor="middle">WAL</text>
<polyline points="600,465 700,465" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<rect x="635.5" y="454.3" width="29.0" height="21.5" fill="#ffffff"/>
<text x="650.0" y="470.3" font-size="14" text-anchor="middle">WAL</text>
<polyline points="240,255 340,255" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="268.5" y="244.3" width="43.0" height="21.5" fill="#ffffff"/>
<text x="290.0" y="260.3" font-size="14" text-anchor="middle">alice</text>
<polyline points="240,355 340,355" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="272.0" y="344.3" width="36.0" height="21.5" fill="#ffffff"/>
<text x="290.0" y="360.3" font-size="14" text-anchor="middle">dave</text>
<text x="40.0" y="566.0" font-size="16" text-anchor="start">Replicas are read-only and asynchronous: a paused replica still answered 2 orders after the 3rd committed</text><text x="40.0" y="586.0" font-size="16" text-anchor="start">(no read-your-writes), then caught up. With shard 1's primary down, its replicas keep answering and shard 0</text><text x="40.0" y="606.0" font-size="16" text-anchor="start">keeps taking writes. Replicas scale reads only; writes scale by adding shards.</text></svg>
