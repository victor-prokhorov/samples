<rect x="420" y="190" width="200" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="520.0" y="236.0" font-size="16" text-anchor="middle">Chromium (Playwright)</text><text x="520.0" y="256.0" font-size="16" text-anchor="middle">member signed in</text>
<rect x="780" y="90" width="320" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="940.0" y="121.0" font-size="16" text-anchor="middle">insecure :53052</text><text x="940.0" y="141.0" font-size="16" text-anchor="middle">no security headers, plain cookie:</text><text x="940.0" y="161.0" font-size="16" text-anchor="middle">script runs, POST accepted,</text><text x="940.0" y="181.0" font-size="16" text-anchor="middle">frame renders</text>
