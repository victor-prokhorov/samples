<text x="40.0" y="576.0" font-size="16" text-anchor="start">Scan: insecure 0/100 (F), hardened 100/100 (A+). The XSS bug is still there in both builds:</text><text x="40.0" y="596.0" font-size="16" text-anchor="start">CSP makes the injected script inert and reports it; escaping the notice is the fix.</text></svg>
