<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1160" height="550" viewBox="0 0 1160 550" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">19. Leader election: a lease row, terms and a fencing token</text>
<rect x="40" y="110" width="300" height="330" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="190.0" y="191.0" font-size="16" text-anchor="middle">leases: one row</text><text x="190.0" y="211.0" font-size="16" text-anchor="middle">holder, term, expires_at</text><text x="190.0" y="231.0" font-size="16" text-anchor="middle">on the database clock</text><text x="190.0" y="251.0" font-size="16" text-anchor="middle"></text><text x="190.0" y="271.0" font-size="16" text-anchor="middle">INSERT ... ON CONFLICT</text><text x="190.0" y="291.0" font-size="16" text-anchor="middle">DO UPDATE WHERE</text><text x="190.0" y="311.0" font-size="16" text-anchor="middle">holder = me OR expired</text><text x="190.0" y="331.0" font-size="16" text-anchor="middle"></text><text x="190.0" y="351.0" font-size="16" text-anchor="middle">TTL 3s, renew every 1s;</text><text x="190.0" y="371.0" font-size="16" text-anchor="middle">every takeover: term + 1</text>
<rect x="440" y="110" width="280" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="580.0" y="151.0" font-size="16" text-anchor="middle">replica a: leader, term 4</text><text x="580.0" y="171.0" font-size="16" text-anchor="middle">runs the job every second</text>
<rect x="440" y="230" width="280" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="580.0" y="261.0" font-size="16" text-anchor="middle">replica b: paused after its</text><text x="580.0" y="281.0" font-size="16" text-anchor="middle">lease check, wakes up</text><text x="580.0" y="301.0" font-size="16" text-anchor="middle">still thinking term 3</text>
<rect x="440" y="350" width="280" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="580.0" y="381.0" font-size="16" text-anchor="middle">replica c: kill -9 as leader;</text><text x="580.0" y="401.0" font-size="16" text-anchor="middle">followers waited 3.0s</text><text x="580.0" y="421.0" font-size="16" text-anchor="middle">for its lease to expire</text>
<rect x="820" y="110" width="300" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="970.0" y="141.0" font-size="16" text-anchor="middle">ticks (no check)</text><text x="970.0" y="161.0" font-size="16" text-anchor="middle">takes b's stale write:</text><text x="970.0" y="181.0" font-size="16" text-anchor="middle">two leaders at once</text>
<rect x="820" y="230" width="300" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="970.0" y="261.0" font-size="16" text-anchor="middle">fenced_ticks: a trigger</text><text x="970.0" y="281.0" font-size="16" text-anchor="middle">rejects term 3 &lt; 4 seen</text><text x="970.0" y="301.0" font-size="16" text-anchor="middle">(stale fencing token)</text>
<polyline points="440,155 340,155" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)" marker-start="url(#head-start)"/>
<rect x="368.5" y="144.3" width="43.0" height="21.5" fill="#ffffff"/>
<text x="390.0" y="160.3" font-size="14" text-anchor="middle">renew</text>
<polyline points="440,275 340,275" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<polyline points="440,395 340,395" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<polyline points="720,155 820,155" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="720,231.9 823.8,200" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<polyline points="720,275 820,275" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<rect x="745.0" y="264.3" width="50.0" height="21.5" fill="#ffffff"/>
<text x="770.0" y="280.3" font-size="14" text-anchor="middle">term 3</text>
<rect x="820" y="350" width="300" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="970.0" y="381.0" font-size="16" text-anchor="middle">Alternative: session lock</text><text x="970.0" y="401.0" font-size="16" text-anchor="middle">pg_try_advisory_lock: no TTL,</text><text x="970.0" y="421.0" font-size="16" text-anchor="middle">held while paused, no fencing</text>
<text x="40.0" y="486.0" font-size="16" text-anchor="start">Without election all three replicas ran the job every second. A lease alone cannot stop a paused leader's</text><text x="40.0" y="506.0" font-size="16" text-anchor="start">late write: self-fencing skips the job after a missed renew, and only the storage checking the term rejects it.</text></svg>
