<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1080" height="660" viewBox="0 0 1080 660" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">09. Transactional outbox with a polling relay</text>
<rect x="40" y="90" width="1000" height="130" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="50.0" y="116.0" font-size="18" text-anchor="start" font-weight="bold">Before: dual write</text>
<rect x="60" y="140" width="380" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="250.0" y="176.0" font-size="16" text-anchor="middle">App: COMMIT the order, then publish</text>
<rect x="560" y="140" width="460" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="790.0" y="166.0" font-size="16" text-anchor="middle">crash in between: the event is lost (or sent</text><text x="790.0" y="186.0" font-size="16" text-anchor="middle">for a change that rolled back)</text>
<polyline points="440,170 560,170" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<rect x="40" y="250" width="1000" height="310" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="50.0" y="276.0" font-size="18" text-anchor="start" font-weight="bold">After: one transaction, a relay publishes</text>
<rect x="60" y="300" width="200" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="160.0" y="326.0" font-size="16" text-anchor="middle">App</text><text x="160.0" y="346.0" font-size="16" text-anchor="middle">emit() inside the</text><text x="160.0" y="366.0" font-size="16" text-anchor="middle">order's transaction</text>
<rect x="300" y="300" width="220" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="410.0" y="326.0" font-size="16" text-anchor="middle">Postgres</text><text x="410.0" y="346.0" font-size="16" text-anchor="middle">orders + outbox row</text><text x="410.0" y="366.0" font-size="16" text-anchor="middle">(one commit)</text>
<rect x="560" y="300" width="220" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="670.0" y="326.0" font-size="16" text-anchor="middle">Relay</text><text x="670.0" y="346.0" font-size="16" text-anchor="middle">FOR UPDATE SKIP</text><text x="670.0" y="366.0" font-size="16" text-anchor="middle">LOCKED, send, mark</text>
<rect x="820" y="300" width="200" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="920.0" y="336.0" font-size="16" text-anchor="middle">Kafka</text><text x="920.0" y="356.0" font-size="16" text-anchor="middle">key = aggregate_id</text>
<rect x="560" y="450" width="220" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="670.0" y="476.0" font-size="16" text-anchor="middle">crash after send:</text><text x="670.0" y="496.0" font-size="16" text-anchor="middle">rows stay unpublished,</text><text x="670.0" y="516.0" font-size="16" text-anchor="middle">sent again</text>
<rect x="820" y="450" width="200" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="920.0" y="476.0" font-size="16" text-anchor="middle">Consumer</text><text x="920.0" y="496.0" font-size="16" text-anchor="middle">skips an event_id</text><text x="920.0" y="516.0" font-size="16" text-anchor="middle">it has seen</text>
<polyline points="260,340 300,340" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="520,340 560,340" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="780,340 820,340" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="920,380 920,450" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="670,380 670,450" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<text x="40.0" y="596.0" font-size="16" text-anchor="start">Send first, mark published second: a crash gives duplicates, never loss (at least once).</text><text x="40.0" y="616.0" font-size="16" text-anchor="start">In the run the consumer received each event twice and processed each once.</text></svg>
