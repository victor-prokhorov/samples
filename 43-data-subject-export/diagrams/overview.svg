<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1290" height="640" viewBox="0 0 1290 640" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">43. Personal-data requests driven by a data inventory</text>
<rect x="40" y="120" width="190" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="135.0" y="151.0" font-size="16" text-anchor="middle">Member</text><text x="135.0" y="171.0" font-size="16" text-anchor="middle">password typed</text><text x="135.0" y="191.0" font-size="16" text-anchor="middle">less than 5 min ago</text>
<rect x="290" y="120" width="230" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="405.0" y="141.0" font-size="16" text-anchor="middle">Portal</text><text x="405.0" y="161.0" font-size="16" text-anchor="middle">POST /me/data-export</text><text x="405.0" y="181.0" font-size="16" text-anchor="middle">subject = the session's</text><text x="405.0" y="201.0" font-size="16" text-anchor="middle">member, never a parameter</text>
<rect x="610" y="120" width="260" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="740.0" y="151.0" font-size="16" text-anchor="middle">Data inventory</text><text x="740.0" y="171.0" font-size="16" text-anchor="middle">table, column, category,</text><text x="740.0" y="191.0" font-size="16" text-anchor="middle">purpose, lawful basis</text>
<rect x="1030" y="120" width="220" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1140.0" y="151.0" font-size="16" text-anchor="middle">Postgres</text><text x="1140.0" y="171.0" font-size="16" text-anchor="middle">12 tables with personal</text><text x="1140.0" y="191.0" font-size="16" text-anchor="middle">data, 3 without</text>
<rect x="610" y="270" width="260" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="740.0" y="301.0" font-size="16" text-anchor="middle">Inventory check</text><text x="740.0" y="321.0" font-size="16" text-anchor="middle">an unknown table or column</text><text x="740.0" y="341.0" font-size="16" text-anchor="middle">fails it: export refused</text>
<rect x="290" y="270" width="230" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="405.0" y="301.0" font-size="16" text-anchor="middle">Export zip</text><text x="405.0" y="321.0" font-size="16" text-anchor="middle">data.json, csv/, README,</text><text x="405.0" y="341.0" font-size="16" text-anchor="middle">index.html, manifest</text>
<rect x="40" y="270" width="190" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="135.0" y="301.0" font-size="16" text-anchor="middle">Request log</text><text x="135.0" y="321.0" font-size="16" text-anchor="middle">received, due in</text><text x="135.0" y="341.0" font-size="16" text-anchor="middle">one month, timeline</text>
<rect x="610" y="440" width="260" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="740.0" y="466.0" font-size="16" text-anchor="middle">Retention policies</text><text x="740.0" y="486.0" font-size="16" text-anchor="middle">how long, from when,</text><text x="740.0" y="506.0" font-size="16" text-anchor="middle">delete or anonymise</text>
<rect x="1030" y="440" width="220" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1140.0" y="466.0" font-size="16" text-anchor="middle">Purge job</text><text x="1140.0" y="486.0" font-size="16" text-anchor="middle">batches of 1000,</text><text x="1140.0" y="506.0" font-size="16" text-anchor="middle">skips legal holds</text>
<rect x="40" y="440" width="190" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="135.0" y="476.0" font-size="16" text-anchor="middle">Erasure (art. 17):</text><text x="135.0" y="496.0" font-size="16" text-anchor="middle">see 18-crypto-shredding</text>
