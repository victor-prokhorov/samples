<polyline points="520,165 610,165" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="536.5" y="154.3" width="57.0" height="21.5" fill="#ffffff"/>
<text x="565.0" y="170.3" font-size="14" text-anchor="middle">collect</text>
<polyline points="870,165 1030,165" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="890.0" y="154.3" width="120.0" height="21.5" fill="#ffffff"/>
<text x="950.0" y="170.3" font-size="14" text-anchor="middle">SELECT per table</text>
<polyline points="740,270 740,210" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="708.0" y="229.3" width="64.0" height="21.5" fill="#ffffff"/>
<text x="740.0" y="245.3" font-size="14" text-anchor="middle">compares</text>
<polyline points="860,270 1030,206.3" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="878.0" y="227.4" width="134.0" height="21.5" fill="#ffffff"/>
<text x="945.0" y="243.4" font-size="14" text-anchor="middle">information_schema</text>
<polyline points="405,210 405,270" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="324,210 216,270" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="245.0" y="229.3" width="50.0" height="21.5" fill="#ffffff"/>
<text x="270.0" y="245.3" font-size="14" text-anchor="middle">logged</text>
<polyline points="870,480 1030,480" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="1140,440 1140,210" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="1083.5" y="314.3" width="113.0" height="21.5" fill="#ffffff"/>
<text x="1140.0" y="330.3" font-size="14" text-anchor="middle">DELETE / UPDATE</text>
<text x="40.0" y="576.0" font-size="16" text-anchor="start">New columns cannot be forgotten: the export reads only the inventory, and the check fails while the schema holds anything the inventory does not.</text><text x="40.0" y="596.0" font-size="16" text-anchor="start">Retention is a table of rules, run by a batched job; a legal hold wins over a policy.</text></svg>
