<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="835" viewBox="0 0 1240 835" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">Step 5: multi-tenancy (tenant = partner organisation)</text>
<rect x="40" y="90" width="360" height="440" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="50.0" y="116.0" font-size="18" text-anchor="start" font-weight="bold">Pool: shared tables</text>
<rect x="60" y="140" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="220.0" y="166.0" font-size="16" text-anchor="middle">One database, shared tables,</text><text x="220.0" y="186.0" font-size="16" text-anchor="middle">every row has org_id</text>
<rect x="60" y="220" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="220.0" y="246.0" font-size="16" text-anchor="middle">RLS policy on every table:</text><text x="220.0" y="266.0" font-size="16" text-anchor="middle">org_id = current org</text>
<rect x="60" y="300" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="220.0" y="326.0" font-size="16" text-anchor="middle">+ cheap, one migration,</text><text x="220.0" y="346.0" font-size="16" text-anchor="middle">thousands of tenants</text>
<rect x="60" y="380" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="220.0" y="406.0" font-size="16" text-anchor="middle">- one missing policy leaks,</text><text x="220.0" y="426.0" font-size="16" text-anchor="middle">noisy neighbours</text>
<rect x="440" y="90" width="360" height="440" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="450.0" y="116.0" font-size="18" text-anchor="start" font-weight="bold">Bridge: schema per org</text>
<rect x="460" y="140" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="620.0" y="166.0" font-size="16" text-anchor="middle">Same tables in each schema:</text><text x="620.0" y="186.0" font-size="16" text-anchor="middle">org_acme, org_globex, ...</text>
<rect x="460" y="220" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="620.0" y="246.0" font-size="16" text-anchor="middle">One role per org: SET LOCAL</text><text x="620.0" y="266.0" font-size="16" text-anchor="middle">role + search_path</text>
<rect x="460" y="300" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="620.0" y="326.0" font-size="16" text-anchor="middle">+ per-org export, restore,</text><text x="620.0" y="346.0" font-size="16" text-anchor="middle">clear boundaries</text>
<rect x="460" y="380" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="620.0" y="406.0" font-size="16" text-anchor="middle">- N migrations, catalog bloat</text><text x="620.0" y="426.0" font-size="16" text-anchor="middle">past a few hundred</text>
<rect x="840" y="90" width="360" height="440" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="850.0" y="116.0" font-size="18" text-anchor="start" font-weight="bold">Silo: database per org</text>
<rect x="860" y="140" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1020.0" y="166.0" font-size="16" text-anchor="middle">One database per org,</text><text x="1020.0" y="186.0" font-size="16" text-anchor="middle">router picks the connection</text>
<rect x="860" y="220" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1020.0" y="246.0" font-size="16" text-anchor="middle">Own backup, region,</text><text x="1020.0" y="266.0" font-size="16" text-anchor="middle">capacity, deletion</text>
<rect x="860" y="300" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1020.0" y="326.0" font-size="16" text-anchor="middle">+ strongest isolation,</text><text x="1020.0" y="346.0" font-size="16" text-anchor="middle">easy to delete a tenant</text>
<rect x="860" y="380" width="320" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="1020.0" y="406.0" font-size="16" text-anchor="middle">- cost and operations</text><text x="1020.0" y="426.0" font-size="16" text-anchor="middle">grow with each tenant</text>
<text x="40.0" y="561.0" font-size="16" text-anchor="start">About forty organisations, one product, same features: pool with RLS by default; a silo only for one that demands it.</text>
<rect x="40" y="600" width="1160" height="150" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="50.0" y="626.0" font-size="18" text-anchor="start" font-weight="bold">Request flow in the pool</text>
<rect x="60" y="650" width="200" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="160.0" y="681.0" font-size="16" text-anchor="middle">Sign-in token</text><text x="160.0" y="701.0" font-size="16" text-anchor="middle">sub, org, role</text>
<rect x="290" y="650" width="200" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="390.0" y="681.0" font-size="16" text-anchor="middle">Server session</text><text x="390.0" y="701.0" font-size="16" text-anchor="middle">(org from IdP)</text>
<rect x="520" y="650" width="220" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="630.0" y="681.0" font-size="16" text-anchor="middle">BEGIN;</text><text x="630.0" y="701.0" font-size="16" text-anchor="middle">SET LOCAL app.org</text>
<rect x="770" y="650" width="180" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="860.0" y="681.0" font-size="16" text-anchor="middle">Query, no</text><text x="860.0" y="701.0" font-size="16" text-anchor="middle">WHERE org_id</text>
<rect x="980" y="650" width="200" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1080.0" y="681.0" font-size="16" text-anchor="middle">RLS filters rows</text><text x="1080.0" y="701.0" font-size="16" text-anchor="middle">app is not owner</text>
<line x1="260" y1="685" x2="290" y2="685" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<line x1="490" y1="685" x2="520" y2="685" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<line x1="740" y1="685" x2="770" y2="685" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<line x1="950" y1="685" x2="980" y2="685" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<text x="40.0" y="791.0" font-size="16" text-anchor="start">Rule: the tenant comes from the session, never from the URL, a header or a form field.</text></svg>
