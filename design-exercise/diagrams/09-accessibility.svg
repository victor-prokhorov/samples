<line x1="620" y1="175" x2="660" y2="175" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<line x1="930" y1="175" x2="970" y2="175" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
