<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="610" viewBox="0 0 1590 610" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">Step 7: accessibility across the whole lifecycle</text>
<rect x="40" y="120" width="270" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="175.0" y="151.0" font-size="16" text-anchor="middle">Design</text><text x="175.0" y="171.0" font-size="16" text-anchor="middle">contrast, focus, plain</text><text x="175.0" y="191.0" font-size="16" text-anchor="middle">language, annotated</text><text x="175.0" y="211.0" font-size="16" text-anchor="middle">components</text>
<rect x="350" y="120" width="270" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="485.0" y="151.0" font-size="16" text-anchor="middle">Build</text><text x="485.0" y="171.0" font-size="16" text-anchor="middle">semantic HTML, labels,</text><text x="485.0" y="191.0" font-size="16" text-anchor="middle">errors tied to fields,</text><text x="485.0" y="211.0" font-size="16" text-anchor="middle">keyboard first</text>
<rect x="660" y="120" width="270" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="795.0" y="151.0" font-size="16" text-anchor="middle">Test</text><text x="795.0" y="171.0" font-size="16" text-anchor="middle">axe in CI, keyboard</text><text x="795.0" y="191.0" font-size="16" text-anchor="middle">journey, screen reader,</text><text x="795.0" y="211.0" font-size="16" text-anchor="middle">zoom 200%</text>
<rect x="970" y="120" width="270" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1105.0" y="151.0" font-size="16" text-anchor="middle">Audit + declare</text><text x="1105.0" y="171.0" font-size="16" text-anchor="middle">external WCAG / RGAA</text><text x="1105.0" y="191.0" font-size="16" text-anchor="middle">audit, accessibility</text><text x="1105.0" y="211.0" font-size="16" text-anchor="middle">statement</text>
<rect x="1280" y="120" width="270" height="110" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1415.0" y="161.0" font-size="16" text-anchor="middle">Listen</text><text x="1415.0" y="181.0" font-size="16" text-anchor="middle">feedback channel,</text><text x="1415.0" y="201.0" font-size="16" text-anchor="middle">fix backlog, re-test</text>
<rect x="660" y="290" width="270" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="795.0" y="321.0" font-size="16" text-anchor="middle">Continuous: every</text><text x="795.0" y="341.0" font-size="16" text-anchor="middle">release, every sprint</text>
