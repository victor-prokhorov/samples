<text x="50.0" y="436.0" font-size="18" text-anchor="start" font-weight="bold">Checklist for every form</text>
<rect x="60" y="460" width="720" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="72.0" y="491.0" font-size="16" text-anchor="start">A visible label on every input, never a placeholder only</text><text x="72.0" y="511.0" font-size="16" text-anchor="start">Errors in text, tied to the field with aria-describedby</text><text x="72.0" y="531.0" font-size="16" text-anchor="start">An error summary that takes focus after submit</text>
<rect x="810" y="460" width="720" height="90" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="822.0" y="491.0" font-size="16" text-anchor="start">Everything reachable and submittable with the keyboard</text><text x="822.0" y="511.0" font-size="16" text-anchor="start">lang on the page, and on parts in the other language</text><text x="822.0" y="531.0" font-size="16" text-anchor="start">Targets at least 24 px, text contrast at least 4.5:1</text></svg>
