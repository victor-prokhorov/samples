<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">Step 1: stakeholder map (power and interest)</text>
<rect x="140" y="100" width="380" height="200" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="330.0" y="166.0" font-size="16" text-anchor="middle">Keep satisfied</text><text x="330.0" y="186.0" font-size="16" text-anchor="middle"></text><text x="330.0" y="206.0" font-size="16" text-anchor="middle">security officer,</text><text x="330.0" y="226.0" font-size="16" text-anchor="middle">data protection officer,</text><text x="330.0" y="246.0" font-size="16" text-anchor="middle">budget owner</text>
<rect x="540" y="100" width="380" height="200" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="730.0" y="166.0" font-size="16" text-anchor="middle" font-weight="bold">Manage closely</text><text x="730.0" y="186.0" font-size="16" text-anchor="middle" font-weight="bold"></text><text x="730.0" y="206.0" font-size="16" text-anchor="middle" font-weight="bold">business owner (benefits team),</text><text x="730.0" y="226.0" font-size="16" text-anchor="middle" font-weight="bold">technical lead, admins of</text><text x="730.0" y="246.0" font-size="16" text-anchor="middle" font-weight="bold">the largest organisations</text>
<rect x="140" y="320" width="380" height="200" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="330.0" y="396.0" font-size="16" text-anchor="middle">Monitor</text><text x="330.0" y="416.0" font-size="16" text-anchor="middle"></text><text x="330.0" y="436.0" font-size="16" text-anchor="middle">external providers,</text><text x="330.0" y="456.0" font-size="16" text-anchor="middle">other IT teams</text>
<rect x="540" y="320" width="380" height="200" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="730.0" y="396.0" font-size="16" text-anchor="middle">Keep informed</text><text x="730.0" y="416.0" font-size="16" text-anchor="middle"></text><text x="730.0" y="436.0" font-size="16" text-anchor="middle">members, help desk,</text><text x="730.0" y="456.0" font-size="16" text-anchor="middle">smaller organisations</text>
<text x="40.0" y="206.0" font-size="16" text-anchor="start">high</text><text x="40.0" y="226.0" font-size="16" text-anchor="start">power</text>
<text x="40.0" y="426.0" font-size="16" text-anchor="start">low</text><text x="40.0" y="446.0" font-size="16" text-anchor="start">power</text>
<text x="270.0" y="551.0" font-size="16" text-anchor="start">low interest</text>
<text x="670.0" y="551.0" font-size="16" text-anchor="start">high interest</text>
<text x="40.0" y="606.0" font-size="16" text-anchor="start">For each stakeholder write: what they need from the portal, what they fear,</text><text x="40.0" y="626.0" font-size="16" text-anchor="start">what decision they own, and how often you meet them.</text></svg>
