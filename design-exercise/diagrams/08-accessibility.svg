<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="980" height="740" viewBox="0 0 980 740" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">Step 7: accessibility across the whole lifecycle</text>
<rect x="40" y="100" width="260" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="170.0" y="136.0" font-size="16" text-anchor="middle">Design</text><text x="170.0" y="156.0" font-size="16" text-anchor="middle">contrast, focus, plain</text><text x="170.0" y="176.0" font-size="16" text-anchor="middle">language, annotated</text><text x="170.0" y="196.0" font-size="16" text-anchor="middle">components</text>
<rect x="360" y="100" width="260" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="490.0" y="136.0" font-size="16" text-anchor="middle">Build</text><text x="490.0" y="156.0" font-size="16" text-anchor="middle">semantic HTML, labels,</text><text x="490.0" y="176.0" font-size="16" text-anchor="middle">errors tied to fields,</text><text x="490.0" y="196.0" font-size="16" text-anchor="middle">keyboard first</text>
<rect x="680" y="100" width="260" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="810.0" y="136.0" font-size="16" text-anchor="middle">Test</text><text x="810.0" y="156.0" font-size="16" text-anchor="middle">axe in CI, keyboard</text><text x="810.0" y="176.0" font-size="16" text-anchor="middle">journey, screen reader,</text><text x="810.0" y="196.0" font-size="16" text-anchor="middle">zoom, reflow at 320 px</text>
<rect x="680" y="280" width="260" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="810.0" y="326.0" font-size="16" text-anchor="middle">Audit + declare</text><text x="810.0" y="346.0" font-size="16" text-anchor="middle">external audit,</text><text x="810.0" y="366.0" font-size="16" text-anchor="middle">accessibility statement</text>
<rect x="360" y="280" width="260" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="490.0" y="326.0" font-size="16" text-anchor="middle">Listen</text><text x="490.0" y="346.0" font-size="16" text-anchor="middle">feedback channel,</text><text x="490.0" y="366.0" font-size="16" text-anchor="middle">fix backlog, re-test</text>
<polyline points="300,160 360,160" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="620,160 680,160" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="810,220 810,280" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="680,340 620,340" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="360,340 170,340 170,220" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<text x="40.0" y="436.0" font-size="16" text-anchor="start">Continuous: every release, every sprint, not once before launch.</text>
<rect x="40" y="470" width="900" height="230" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="50.0" y="496.0" font-size="18" text-anchor="start" font-weight="bold">Checklist for every form</text>
<rect x="60" y="520" width="860" height="160" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="65.0" y="546.0" font-size="16" text-anchor="start">A visible label on every input, never a placeholder only</text><text x="65.0" y="566.0" font-size="16" text-anchor="start">Errors in text, tied to the field with aria-describedby; an error summary that takes focus</text><text x="65.0" y="586.0" font-size="16" text-anchor="start">Everything reachable and submittable with the keyboard</text><text x="65.0" y="606.0" font-size="16" text-anchor="start">lang on the page, and on parts in the other language</text><text x="65.0" y="626.0" font-size="16" text-anchor="start">Reflow at 320 px wide without horizontal scrolling; text at 200%</text><text x="65.0" y="646.0" font-size="16" text-anchor="start">Targets at least 24 px, text contrast at least 4.5:1</text><text x="65.0" y="666.0" font-size="16" text-anchor="start">Sign-in without a memory test: paste and password managers allowed</text></svg>
