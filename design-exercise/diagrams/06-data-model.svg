<text x="40.0" y="861.0" font-size="16" text-anchor="start">Keys and indexes lead with org_id. Foreign keys include org_id, so a row cannot point into another organisation.</text><text x="40.0" y="881.0" font-size="16" text-anchor="start">One membership per person (an assumption): (iss, sub) is unique. If a person can belong to two organisations,</text><text x="40.0" y="901.0" font-size="16" text-anchor="start">split member into person (iss, sub) and membership (org_id, person_id).</text></svg>
