<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">Step 6: security, defence in depth</text>
<rect x="40" y="100" width="220" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="150.0" y="138.0" font-size="16" text-anchor="middle" font-weight="bold">Identity</text>
<rect x="280" y="100" width="860" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="292.0" y="128.0" font-size="16" text-anchor="start">Single sign-on (OIDC, code + PKCE); MFA for staff and admins;</text><text x="292.0" y="148.0" font-size="16" text-anchor="start">the portal stores no passwords</text>
<rect x="40" y="184" width="220" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="150.0" y="222.0" font-size="16" text-anchor="middle" font-weight="bold">Authorisation</text>
<rect x="280" y="184" width="860" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="292.0" y="212.0" font-size="16" text-anchor="start">Roles per organisation (member, employer admin, staff),</text><text x="292.0" y="232.0" font-size="16" text-anchor="start">checked on every route and every query; 404, not 403</text>
<rect x="40" y="268" width="220" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="150.0" y="306.0" font-size="16" text-anchor="middle" font-weight="bold">Data isolation</text>
<rect x="280" y="268" width="860" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="292.0" y="296.0" font-size="16" text-anchor="start">Row-Level Security by org_id; the app role is not the table owner;</text><text x="292.0" y="316.0" font-size="16" text-anchor="start">SET LOCAL per transaction</text>
<rect x="40" y="352" width="220" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="150.0" y="390.0" font-size="16" text-anchor="middle" font-weight="bold">Application</text>
<rect x="280" y="352" width="860" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="292.0" y="380.0" font-size="16" text-anchor="start">OWASP ASVS level 2: validation on the server, CSRF, CSP,</text><text x="292.0" y="400.0" font-size="16" text-anchor="start">safe redirects, parameterised SQL, dependency audit</text>
<rect x="40" y="436" width="220" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="150.0" y="474.0" font-size="16" text-anchor="middle" font-weight="bold">Sensitive changes</text>
<rect x="280" y="436" width="860" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="292.0" y="464.0" font-size="16" text-anchor="start">Four-eyes approval, re-authentication for bank details,</text><text x="292.0" y="484.0" font-size="16" text-anchor="start">notify the old and the new address</text>
<rect x="40" y="520" width="220" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="150.0" y="558.0" font-size="16" text-anchor="middle" font-weight="bold">Personal data</text>
<rect x="280" y="520" width="860" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="292.0" y="548.0" font-size="16" text-anchor="start">GDPR: minimise, retention periods, encryption in transit and at rest,</text><text x="292.0" y="568.0" font-size="16" text-anchor="start">erasure that also reaches backups (crypto-shredding)</text>
<rect x="40" y="604" width="220" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="150.0" y="642.0" font-size="16" text-anchor="middle" font-weight="bold">Operations</text>
<rect x="280" y="604" width="860" height="64" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="292.0" y="632.0" font-size="16" text-anchor="start">Secrets in a vault, patching, tested backups, append-only audit log,</text><text x="292.0" y="652.0" font-size="16" text-anchor="start">alerts on unusual access, incident runbook</text>
<text x="40.0" y="716.0" font-size="16" text-anchor="start">Ask for each layer: what is the worst thing one bug here could leak? Then make sure another layer stops it.</text></svg>
