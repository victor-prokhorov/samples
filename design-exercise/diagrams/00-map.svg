<rect x="820" y="140" width="300" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="970.0" y="171.0" font-size="16" text-anchor="middle">10  Migration</text><text x="970.0" y="191.0" font-size="16" text-anchor="middle">legacy to new, slice by slice</text>
<rect x="820" y="230" width="300" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="970.0" y="261.0" font-size="16" text-anchor="middle">11  Operate + measure</text><text x="970.0" y="281.0" font-size="16" text-anchor="middle">runbooks, KPIs</text>
<rect x="820" y="320" width="300" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="970.0" y="351.0" font-size="16" text-anchor="middle">12  Plan + risks</text><text x="970.0" y="371.0" font-size="16" text-anchor="middle">phases, top risks, next</text>
<line x1="380" y1="300" x2="420" y2="390" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<line x1="760" y1="390" x2="800" y2="255" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<text x="800.0" y="476.0" font-size="16" text-anchor="start">Each step answers four questions:</text><text x="800.0" y="496.0" font-size="16" text-anchor="start">What do we do?</text><text x="800.0" y="516.0" font-size="16" text-anchor="start">Why (which user need or rule)?</text><text x="800.0" y="536.0" font-size="16" text-anchor="start">What is the trade-off?</text><text x="800.0" y="556.0" font-size="16" text-anchor="start">How do we know it worked?</text></svg>
