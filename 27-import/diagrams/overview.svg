<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1260" height="610" viewBox="0 0 1260 610" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">27. Monthly CSV import: one transaction per file, rerun-safe</text>
<rect x="40" y="90" width="1180" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="630.0" y="116.0" font-size="16" text-anchor="middle">Before: row-by-row INSERT. A rerun doubles every row (12 rows, 3001.50); a typo on line 4 leaves</text><text x="630.0" y="136.0" font-size="16" text-anchor="middle">the file half-applied, and the corrected resend duplicates what was already committed</text>
<rect x="40" y="240" width="200" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="140.0" y="276.0" font-size="16" text-anchor="middle">acme-2026-09-</text><text x="140.0" y="296.0" font-size="16" text-anchor="middle">contributions.csv</text><text x="140.0" y="316.0" font-size="16" text-anchor="middle">+ .ctl: row count,</text><text x="140.0" y="336.0" font-size="16" text-anchor="middle">amount total</text>
<rect x="290" y="190" width="930" height="210" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="300.0" y="216.0" font-size="18" text-anchor="start" font-weight="bold">One transaction per file (a dry run rolls it back)</text>
<rect x="310" y="240" width="200" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="410.0" y="286.0" font-size="16" text-anchor="middle">COPY into a</text><text x="410.0" y="306.0" font-size="16" text-anchor="middle">TEMP staging</text><text x="410.0" y="326.0" font-size="16" text-anchor="middle">table</text>
<rect x="540" y="240" width="200" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="640.0" y="286.0" font-size="16" text-anchor="middle">rules in SQL -&gt;</text><text x="640.0" y="306.0" font-size="16" text-anchor="middle">import_rejects:</text><text x="640.0" y="326.0" font-size="16" text-anchor="middle">line, rule, reason</text>
<rect x="770" y="240" width="200" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="870.0" y="286.0" font-size="16" text-anchor="middle">diff: new, changed,</text><text x="870.0" y="306.0" font-size="16" text-anchor="middle">unchanged, missing;</text><text x="870.0" y="326.0" font-size="16" text-anchor="middle">control total</text>
<rect x="1000" y="240" width="200" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="1100.0" y="276.0" font-size="16" text-anchor="middle">upsert on the</text><text x="1100.0" y="296.0" font-size="16" text-anchor="middle">natural key, IS</text><text x="1100.0" y="316.0" font-size="16" text-anchor="middle">DISTINCT FROM;</text><text x="1100.0" y="336.0" font-size="16" text-anchor="middle">batch + sha256</text>
<polyline points="240,300 310,300" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="510,300 540,300" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="740,300 770,300" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="970,300 1000,300" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="40" y="440" width="560" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="320.0" y="466.0" font-size="16" text-anchor="middle">the same bytes again, under any name:</text><text x="320.0" y="486.0" font-size="16" text-anchor="middle">ALREADY APPLIED, a no-op (sha256)</text>
<rect x="660" y="440" width="560" height="60" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="940.0" y="466.0" font-size="16" text-anchor="middle">the corrected full month: 1 row inserted,</text><text x="940.0" y="486.0" font-size="16" text-anchor="middle">5 unchanged, no duplicate</text>
<text x="40.0" y="546.0" font-size="16" text-anchor="start">Bad lines are rejected with a reason; a wrong header, a short file, over 50% rejects or a control total that</text><text x="40.0" y="566.0" font-size="16" text-anchor="start">does not add up refuses the whole file. Every row knows its batch, so the load is reconciled with a query.</text></svg>
