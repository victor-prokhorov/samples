<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1140" height="610" viewBox="0 0 1140 610" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">17. One audit trail across services, through an outbox</text>
<rect x="40" y="110" width="320" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="200.0" y="136.0" font-size="16" text-anchor="middle">orders database</text><text x="200.0" y="156.0" font-size="16" text-anchor="middle">change + audit_outbox row</text><text x="200.0" y="176.0" font-size="16" text-anchor="middle">(actor, reason, before, after)</text><text x="200.0" y="196.0" font-size="16" text-anchor="middle">in one transaction</text>
<rect x="40" y="270" width="320" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="200.0" y="306.0" font-size="16" text-anchor="middle">billing database</text><text x="200.0" y="326.0" font-size="16" text-anchor="middle">same: change + audit_outbox</text><text x="200.0" y="346.0" font-size="16" text-anchor="middle">row in one transaction</text>
<rect x="460" y="190" width="240" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="580.0" y="226.0" font-size="16" text-anchor="middle">Shipper</text><text x="580.0" y="246.0" font-size="16" text-anchor="middle">claim SKIP LOCKED,</text><text x="580.0" y="266.0" font-size="16" text-anchor="middle">send, then mark shipped</text>
<rect x="800" y="190" width="300" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="950.0" y="216.0" font-size="16" text-anchor="middle">Central audit database</text><text x="950.0" y="236.0" font-size="16" text-anchor="middle">audit_events, PK event_id</text><text x="950.0" y="256.0" font-size="16" text-anchor="middle">(re-sends skipped); trigger</text><text x="950.0" y="276.0" font-size="16" text-anchor="middle">rejects UPDATE, DELETE</text>
<rect x="460" y="360" width="240" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="580.0" y="396.0" font-size="16" text-anchor="middle">crash after send:</text><text x="580.0" y="416.0" font-size="16" text-anchor="middle">re-sent, never lost</text>
<rect x="40" y="430" width="320" height="70" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="200.0" y="461.0" font-size="16" text-anchor="middle">psql UPDATE total = 0:</text><text x="200.0" y="481.0" font-size="16" text-anchor="middle">bypasses the app, no trace</text>
<polyline points="360,200 460,200" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="360,280 460,280" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="700,240 800,240" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="580,290 580,360" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<polyline points="40,465 20,465 20,160 40,160" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<text x="40.0" y="546.0" font-size="16" text-anchor="start">01's same-transaction audit plus 09's outbox: a rolled-back change leaves no event, a committed one cannot</text><text x="40.0" y="566.0" font-size="16" text-anchor="start">miss its event. One timeline with actors and reasons; writes outside the app need pgaudit or triggers too.</text></svg>
