<text x="40.0" y="626.0" font-size="16" text-anchor="start">Sync and webhooks only see what ModifiedOn and notifications show; reconciliation finds the rest (hard deletes, backdated imports, hand edits).</text><text x="40.0" y="646.0" font-size="16" text-anchor="start">The domain imports nothing from the layer: a checked dependency rule.</text></svg>
