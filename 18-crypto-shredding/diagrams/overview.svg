<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1360" height="660" viewBox="0 0 1360 660" font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="28" text-anchor="start" font-weight="bold">18. Crypto-shredding: erase a person by deleting one key</text>
<rect x="40" y="140" width="180" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="130.0" y="166.0" font-size="16" text-anchor="middle">App</text><text x="130.0" y="186.0" font-size="16" text-anchor="middle">seals each PII</text><text x="130.0" y="206.0" font-size="16" text-anchor="middle">field with AAD</text><text x="130.0" y="226.0" font-size="16" text-anchor="middle">subjectId:field</text>
<rect x="300" y="130" width="320" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="460.0" y="166.0" font-size="16" text-anchor="middle">events (append-only)</text><text x="460.0" y="186.0" font-size="16" text-anchor="middle">type, order, amount in clear;</text><text x="460.0" y="206.0" font-size="16" text-anchor="middle">name, email, address =</text><text x="460.0" y="226.0" font-size="16" text-anchor="middle">AES-256-GCM under alice's DEK</text>
<rect x="300" y="320" width="320" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="460.0" y="356.0" font-size="16" text-anchor="middle">Backup, replicas, Kafka:</text><text x="460.0" y="376.0" font-size="16" text-anchor="middle">the same ciphertext</text>
<rect x="720" y="130" width="320" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="880.0" y="166.0" font-size="16" text-anchor="middle">keys database</text><text x="880.0" y="186.0" font-size="16" text-anchor="middle">subject_keys: one wrapped</text><text x="880.0" y="206.0" font-size="16" text-anchor="middle">DEK per subject</text><text x="880.0" y="226.0" font-size="16" text-anchor="middle">subject_lookup: HMAC(email)</text>
<rect x="720" y="320" width="320" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="880.0" y="356.0" font-size="16" text-anchor="middle">kms database (a KMS stand-in)</text><text x="880.0" y="376.0" font-size="16" text-anchor="middle">KEK wraps every DEK</text>
<rect x="1120" y="140" width="200" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="1220.0" y="176.0" font-size="16" text-anchor="middle">erase alice:</text><text x="1220.0" y="196.0" font-size="16" text-anchor="middle">DELETE her</text><text x="1220.0" y="216.0" font-size="16" text-anchor="middle">key row</text>
<polyline points="220,190 300,190" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<polyline points="880,130 880,100 130,100 130,140" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="490.5" y="89.3" width="29.0" height="21.5" fill="#ffffff"/>
<text x="505.0" y="105.3" font-size="14" text-anchor="middle">DEK</text>
<polyline points="460,250 460,320" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="435.0" y="274.3" width="50.0" height="21.5" fill="#ffffff"/>
<text x="460.0" y="290.3" font-size="14" text-anchor="middle">copies</text>
<polyline points="880,250 880,320" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="855.0" y="274.3" width="50.0" height="21.5" fill="#ffffff"/>
<text x="880.0" y="290.3" font-size="14" text-anchor="middle">unwrap</text>
<polyline points="1120,190 1040,190" fill="none" stroke="#1e1e1e" stroke-width="1.2" marker-end="url(#head)"/>
<rect x="40" y="470" width="580" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="330.0" y="506.0" font-size="16" text-anchor="middle">Afterwards alice reads &lt;erased&gt; everywhere, the restored</text><text x="330.0" y="526.0" font-size="16" text-anchor="middle">backup included; bob is unchanged; 49.50 over 3 events still adds up</text>
<rect x="720" y="470" width="600" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="1020.0" y="506.0" font-size="16" text-anchor="middle">Trap: restoring an old key-store backup brings alice back.</text><text x="1020.0" y="526.0" font-size="16" text-anchor="middle">Keep its backups short-lived, or replay an erasure log.</text>
<text x="40.0" y="596.0" font-size="16" text-anchor="start">Envelope encryption: rotating the KEK rewraps the DEKs only; not one event is re-encrypted.</text><text x="40.0" y="616.0" font-size="16" text-anchor="start">Out of scope: plaintext copies made earlier (logs, caches, exports) and identifying metadata left in clear.</text></svg>
