<text x="40.0" y="526.0" font-size="16" text-anchor="start">A flip is a row update: the trigger audits it and NOTIFY drops the cached copy, so the next evaluation sees it.</text><text x="40.0" y="546.0" font-size="16" text-anchor="start">bucket = sha256(flag key : member id) mod 10000, so a member keeps the feature as the percentage grows.</text></svg>
