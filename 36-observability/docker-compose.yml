services:
  postgres:
    image: postgres:16
    # Log every statement with its duration: the sqlcommenter comment the API appends puts the
    # trace id into each line, so a database log line can be joined to its trace.
    command: ["postgres", "-c", "log_min_duration_statement=0"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "55466:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
